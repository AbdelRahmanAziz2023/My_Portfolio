<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/logo/favicon-64.png" />
    <meta name="theme-color" content="#141218" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Abdelrahman Aziz" />
    <meta name="robots" content="index, follow" />
    <!--
      Static global metadata (crawlers that do not run JavaScript see these).
      The title/description mirror `siteMeta` in src/data/siteMeta.ts — a build
      warning fires if they drift. Absolute `canonical` / `og:url` / `og:image`
      values are added at build time by scripts/generate-seo.mjs once a
      production URL is known, and are refreshed per route at runtime by
      src/utils/seo.ts.
    -->
    <meta name="description" content="Portfolio of Abdelrahman Aziz — React Native and mobile developer building cross-platform apps with React Native, Flutter, and TypeScript, alongside full-stack work in React, Angular, Node.js, and Express." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abdelrahman Aziz" />
    <meta property="og:title" content="Abdelrahman Aziz | React Native &amp; Mobile Developer" />
    <meta property="og:description" content="Portfolio of Abdelrahman Aziz — React Native and mobile developer building cross-platform apps with React Native, Flutter, and TypeScript, alongside full-stack work in React, Angular, Node.js, and Express." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abdelrahman Aziz | React Native &amp; Mobile Developer" />
    <meta name="twitter:description" content="Portfolio of Abdelrahman Aziz — React Native and mobile developer building cross-platform apps with React Native, Flutter, and TypeScript, alongside full-stack work in React, Angular, Node.js, and Express." />
    <title>Abdelrahman Aziz | React Native &amp; Mobile Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
